[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obfumal"
version = "0.1.0"
description = "Reproduction of OBFU-mal: Deep RL for Malware Obfuscation"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "User", email = "user@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "gymnasium>=0.29.0",
    "numpy",
    "torch>=2.0.0",
    "lief",
    "pefile",
    "lightgbm",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "click"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy"
]

[tool.setuptools.packages.find]
where = ["src"]
