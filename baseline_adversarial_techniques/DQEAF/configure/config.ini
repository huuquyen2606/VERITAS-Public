[Dataset]
malicious_dir = data/malware
malicious_exclude_dirs = Benign
max_malicious = 0
max_benign = 0

[Classifier]
# Surrogate classifier backend: 'gbdt' (PEFeatureExtractor 2350-d) or 'lgbm_ember' (EMBER 2381-d)
backend = gbdt
gbdt_model_path = LIGHTGBMs/gradient_boosting.pkl
gbdt_threshold = 0.9
# lgbm_model_path = LIGHTGBMs/result.txt
# lgbm_threshold = 0.8336

[Train]
D = 1500
T = 10
F = 200
test_interval = 1000
max_ratio = 7.0
gamma = 0.99
batch_size = 32
replay_start_size = 1000
memory_capacity = 100000
target_update_interval = 100
learning_rate = 0.001
seed = 1337

[Runtime]
device = cpu

[Paths]
output_dir = outputs
