##
## Configured clamd.conf for Bulk Malware Analysis
##

# Example line removed to enable configuration

# Logging Options
#LogFile "C:\Program Files\ClamAV\clamd.log"
#LogFileUnlock yes
#LogFileMaxSize 2M
#LogTime yes
#LogClean yes
#LogVerbose yes
#LogRotate yes

# System & Environment Options
#PidFile "C:\Program Files\ClamAV\clamd.pid"
#TemporaryDirectory "C:\temp"
#DatabaseDirectory "C:\Program Files\ClamAV\database"
#CVDCertsDirectory "C:\Program Files\ClamAV\certs"
#FIPSCryptoHashLimits no
#OfficialDatabaseOnly no
#FailIfCvdOlderThan -1

# TCP Socket Binding for Network Scanning (e.g., via Python / pyclamd)
TCPSocket 3310
TCPAddr 127.0.0.1

# Command Controls
#EnableShutdownCommand no
#EnableReloadCommand no
#EnableStatsCommand no
#EnableVersionCommand no

# Performance & Threading
MaxThreads 30
MaxQueue 200
#MaxConnectionQueueLength 30
#StreamMaxLength 25M
#StreamMinPort 30000
#StreamMaxPort 32000

# Timeout Adjustments for Complex Payload Processing
ReadTimeout 300
#CommandReadTimeout 30
#SendBufTimeout 200
#IdleTimeout 60

# Scanning Exclusions & File Systems
#ExcludePath "C:\temp"
#MaxDirectoryRecursion 15
#FollowDirectorySymlinks no
#FollowFileSymlinks no
#CrossFilesystems yes
#SelfCheck 600
#ConcurrentDatabaseReload yes

# Event Handling & Debugging
#User clamav
#ExitOnOOM yes
#Foreground no
#Debug no
#LeaveTemporaryFiles no
#GenerateMetadataJson no
#AllowAllMatchScan yes

# Heuristics & PUA Settings
#DetectPUA no
#HeuristicAlerts yes
#HeuristicScanPrecedence no
#AlertBrokenExecutables no
#AlertBrokenMedia no
#AlertEncrypted no
#AlertEncryptedArchive no
#AlertEncryptedDoc no
#AlertOLE2Macros no
#AlertPhishingSSLMismatch no
#AlertPhishingCloak no

# File Processors
#ScanPE yes
#DisableCertCheck no
#ScanELF yes
#ScanOLE2 yes
#ScanPDF yes
#ScanSWF yes
#ScanXMLDOCS yes
#ScanHWP3 yes
#ScanOneNote yes
#ScanImage yes
#ScanImageFuzzyHash yes
#ScanMail yes
#ScanArchive yes

# Deep Scanning Limits for Obfuscated / Packed Samples
MaxScanTime 300000
MaxScanSize 2000M
MaxFileSize 2000M
MaxRecursion 50
MaxFiles 15000
MaxEmbeddedPE 100M
MaxHTMLNormalize 100M
MaxHTMLNoTags 16M
MaxScriptNormalize 50M
MaxZipTypeRcg 1M
MaxPartitions 128
MaxIconsPE 200
MaxRecHWP3 16

# PCRE Match Limits
PCREMatchLimit 100000
PCRERecMatchLimit 10000
PCREMaxFileSize 400M
#AlertExceedsMax no

# Bytecode Settings
#Bytecode yes
#BytecodeSecurity TrustSigned
#BytecodeUnsigned no
#BytecodeTimeout 10000